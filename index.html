<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Villa Тооллого — Нэгтгэл</title>
<style>
  :root{
    --ink:#1E2420;
    --ink-soft:#4B564E;
    --base:#F5F4EF;
    --base-raised:#FFFFFF;
    --border:#DBD6C8;
    --teal:#2B6E5E;
    --teal-deep:#1E4F43;
    --amber:#B5702C;
    --amber-bg:#FBEEDF;
    --red:#A63F2B;
    --red-bg:#F8E7E1;
    --gray-bg:#EAE7DD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--base);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
    line-height:1.4;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:16px 12px 60px;}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif; margin:0;}

  /* Login Screen Style */
  .login-overlay {
    position: fixed; inset: 0; background: var(--base);
    display: flex; align-items: center; justify-content: center; z-index: 2000;
  }
  .login-box {
    background: var(--base-raised); border: 1px solid var(--border);
    padding: 30px; border-radius: 12px; text-align: center; max-width: 340px; width: 90%;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .login-box h2 { font-size: 1.5rem; margin-bottom: 6px; }
  .login-box input {
    width: 100%; padding: 12px; margin: 16px 0; text-align: center;
    font-size: 1.3rem; letter-spacing: 6px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff;
  }
  .login-box input:focus { outline: none; border-color: var(--teal); }

  header{margin-bottom:20px;}
  .header-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  h1{font-size:1.6rem; font-weight:600;}
  .totalcount{font-family:'Courier New',monospace; font-size:0.85rem; color:var(--ink-soft);}
  .subtitle{color:var(--ink-soft); margin-top:4px; font-size:0.85rem;}

  .tilegrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  .tile{
    aspect-ratio:1/1;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid var(--border);
    background:var(--base-raised);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
    user-select:none;
  }
  .tile:active{transform:scale(0.96);}
  .tile.selected{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal);}
  .tile .num{font-family:'Courier New',monospace; font-weight:700; font-size:0.95rem;}
  .tile .badge{font-family:'Courier New',monospace; font-size:0.65rem; color:var(--red); font-weight:700; margin-top:2px;}
  .tile .dot{width:7px;height:7px;border-radius:50%;position:absolute;top:6px;right:6px;}

  .add-villa-tile {
    border: 1.5px dashed var(--teal);
    color: var(--teal);
    font-weight: bold;
    font-size: 1.4rem;
    background: transparent;
  }
  .add-villa-tile:hover { background: rgba(43,110,94,0.05); }

  .card{background:var(--base-raised); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;}
  .card.empty{text-align:center; color:var(--ink-soft); padding:36px 16px;}

  .status-good-bg{background:#E7F0EC; color:var(--teal-deep); border:1px solid #BFDACE;}
  .status-warn-bg{background:var(--amber-bg); color:var(--amber); border:1px solid #E4C49B;}
  .status-bad-bg{background:var(--red-bg); color:var(--red); border:1px solid #E3B7AB;}
  .status-empty-bg{background:var(--gray-bg); color:var(--ink-soft); border:1px solid var(--border);}

  .room-tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); padding:0 2px; flex-wrap:wrap;}
  .room-tab{padding:10px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-weight:600; font-size:0.85rem; color:var(--ink-soft); border:1px solid transparent;}
  .room-tab.active{background:var(--base-raised); border:1px solid var(--border); border-bottom:1px solid var(--base-raised); color:var(--ink); margin-bottom:-1px;}

  .room-panel{border-radius:0 0 12px 12px; margin-top:0; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:0.88rem; min-width:480px;}
  thead th{text-align:left; color:var(--ink-soft); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; padding-bottom:8px;}
  tbody tr{border-top:1px solid var(--border);}
  tbody td{padding:8px 2px;}
  .col-num{width:28px; font-family:'Courier New',monospace; color:var(--ink-soft);}
  .col-count{width:70px;}
  .col-status{width:180px;}
  .col-del{width:36px; text-align:right;}

  input.item-input{background:transparent; border:1px solid transparent; border-radius:6px; padding:6px 8px; width:100%; font-size:0.88rem; font-family:inherit;}
  input.item-input:hover, input.item-input:focus{border-color:var(--teal); background:#fff; outline:none;}
  input.count-input{font-family:'Courier New',monospace;}

  select.status-select{font-size:0.78rem; border-radius:999px; padding:6px 8px; border:1px solid transparent; font-weight:600; cursor:pointer; width:100%;}

  .btn{padding:8px 14px; border-radius:8px; font-weight:600; font-size:0.82rem; cursor:pointer; border:none; transition:opacity .12s; font-family:inherit; display:inline-flex; align-items:center; justify-content:center;}
  .btn-primary{background:var(--teal); color:white;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:var(--red); border:none; font-size:1.2rem; cursor:pointer; padding:4px 8px;}
  .status-chip{padding:3px 8px; border-radius:999px; font-size:0.72rem; font-weight:600;}
  .loading{text-align:center; padding:80px 0; color:var(--ink-soft); font-size:1rem;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tmkiuebrkmfnpmuyxxwd.supabase.co";
const SUPABASE_KEY = "sb_publishable_5JQga2wW_O8OAqkZTaEf_Q_C1mtz87X";
const supabase = (window.supabase && typeof window.supabase.createClient === 'function')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;
</script>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="login-overlay">
  <div class="login-box">
    <h2>Вилла Тооллого</h2>
    <p style="font-size: 0.85rem; color: var(--ink-soft); margin-top:4px;">Пин кодоо оруулж нэвтэрнэ үү</p>
    <input type="password" id="pin-input" placeholder="****" maxlength="8" onkeyup="if(event.key==='Enter') checkPin()">
    <button class="btn btn-primary" style="width: 100%; padding: 10px;" onclick="checkPin()">Нэвтрэх</button>
  </div>
</div>

<div class="wrap" id="app" style="display: none;"><div class="loading">Дата синк хийж байна...</div></div>

<script>
// НЭВТРЭХ НУУЦ ҮГ (Хүссэн кодоороо сольж болно)
const APP_PIN = "1234"; 

let ROOM_TYPES = ["Унтлагын", "Зочны", "Гадна", "Угаалгын", "Гал тогоо"];
const DATA_KEY = "villa-inventory-data-v2";
const VILLA_LIST_KEY = "villa-list-v2";

let state = {
  villas: Array.from({length: 31}, (_, i) => String(i + 1)), // 1-31 вилла
  selectedVilla: null,
  activeRoom: ROOM_TYPES[0],
  data: {},
  loaded: false,
  saveStatus: 'saved',
  view: 'main'
};

function checkPin() {
  const input = document.getElementById('pin-input').value;
  if(input === APP_PIN) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    alert("Нэвтрэх пин код буруу байна!");
  }
}

function emptyVilla(){
  const rooms = {};
  ROOM_TYPES.forEach(r => { rooms[r] = []; });
  return { rooms };
}

function ensureVilla(id){
  if(!state.data[id]) state.data[id] = emptyVilla();
  ROOM_TYPES.forEach(r => {
    if(!state.data[id].rooms[r]) state.data[id].rooms[r] = [];
  });
  return state.data[id];
}

function uid(){ return Math.random().toString(36).slice(2,9); }

async function loadData(){
  if(supabase){
    try{
      // Виллануудын жагсаалт авах
      const { data: vList } = await supabase.from('villa_store').select('value').eq('key', VILLA_LIST_KEY).maybeSingle();
      if(vList && vList.value) state.villas = vList.value;

      // Тооллогын дата авах
      const { data } = await supabase.from('villa_store').select('value').eq('key', DATA_KEY).maybeSingle();
      if(data && data.value) state.data = data.value;

      // Real-time listener
      supabase.channel('public:villa_store')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'villa_store' }, payload => {
          if(payload.new && payload.new.key === DATA_KEY){
            state.data = payload.new.value;
            render();
          }
          if(payload.new && payload.new.key === VILLA_LIST_KEY){
            state.villas = payload.new.value;
            render();
          }
        }).subscribe();

    }catch(e){ console.error("Cloud load error:", e); }
  }
  state.loaded = true;
  render();
}

async function saveData(){
  if(!supabase) return;
  state.saveStatus = 'saving';
  renderSaveStatus();
  try{
    await supabase.from('villa_store').upsert({ key: DATA_KEY, value: state.data });
    await supabase.from('villa_store').upsert({ key: VILLA_LIST_KEY, value: state.villas });
    state.saveStatus = 'saved';
  }catch(e){
    state.saveStatus = 'error';
  }
  renderSaveStatus();
}

function renderSaveStatus(){
  const el = document.getElementById('save-status');
  if(!el) return;
  el.textContent = state.saveStatus === 'saving' ? '☁️ Хадгалж байна...' : '✓ Хадгалагдсан (Cloud)';
}

function addVillaPrompt(){
  const name = prompt("Шинэ Вилла эсвэл Байшингийн нэр/дугаарыг оруулна уу (Жишээ нь: 32 эсвэл VIP-1):");
  if(name && name.trim()){
    const trimmed = name.trim();
    if(state.villas.includes(trimmed)){
      alert("Ийм вилла аль хэдийн байна!");
      return;
    }
    state.villas.push(trimmed);
    ensureVilla(trimmed);
    saveData();
    render();
  }
}

function deleteVilla(id){
  if(confirm(`Та ${id} дугаартай виллаг устгахдаа итгэлтэй байна уу?`)){
    state.villas = state.villas.filter(v => v !== id);
    delete state.data[id];
    if(state.selectedVilla === id) state.selectedVilla = null;
    saveData();
    render();
  }
}

function villaIssueCount(id){
  const v = state.data[id];
  if(!v) return 0;
  let count = 0;
  ROOM_TYPES.forEach(r => {
    (v.rooms[r]||[]).forEach(item => {
      if(item.status && item.status !== "Гэмтэлгүй байгаа") count++;
    });
  });
  return count;
}

function totalIssuesAll(){
  let t = 0;
  state.villas.forEach(id => { t += villaIssueCount(id); });
  return t;
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded) return;

  let html = `
    <header>
      <div class="header-row">
        <div>
          <h1>Villa Тооллого</h1>
          <div class="totalcount">${state.villas.length} байшин &middot; ${totalIssuesAll()} гэмтэл бүртгэгдсэн</div>
        </div>
        <button class="btn btn-ghost" onclick="location.reload()">Гарах</button>
      </div>
      <div style="margin-top:12px; display:flex; align-items:center; justify-content:space-between;">
        <button class="btn btn-ghost" onclick="toggleReport()">${state.view==='report' ? '← Буцах' : '📋 Нэгтгэлийн тайлан'}</button>
        <span id="save-status" style="font-size:0.8rem; font-weight:bold; color:#2E7D32;">✓ Хадгалагдсан (Cloud)</span>
      </div>
    </header>
  `;

  if(state.view === 'report'){
    html += renderReport();
    app.innerHTML = html;
    return;
  }

  // Виллануудын grid
  html += `<div class="tilegrid">`;
  state.villas.forEach(id => {
    const issues = villaIssueCount(id);
    const sel = state.selectedVilla === id ? 'selected' : '';
    html += `
      <div class="tile ${sel}" onclick="selectVilla('${id}')">
        ${issues > 0 ? `<div class="dot" style="background:var(--red)"></div>` : ''}
        <span class="num">${id}</span>
        ${issues > 0 ? `<span class="badge">${issues}</span>` : ''}
      </div>
    `;
  });
  // Шинэ вилла нэмэх товч
  html += `<div class="tile add-villa-tile" onclick="addVillaPrompt()" title="Шинэ байшин нэмэх">+</div>`;
  html += `</div>`;

  if(state.selectedVilla){
    html += renderVillaDetail(state.selectedVilla);
  } else {
    html += `<div class="card empty">Дээрээс засах Villa дугаараа сонгоно уу.</div>`;
  }

  app.innerHTML = html;
}

function selectVilla(id){ state.selectedVilla = id; state.activeRoom = ROOM_TYPES[0]; ensureVilla(id); render(); }
function setActiveRoom(r){ state.activeRoom = r; render(); }
function toggleReport(){ state.view = state.view === 'report' ? 'main' : 'report'; render(); }

function renderVillaDetail(id){
  ensureVilla(id);
  const v = state.data[id];

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3>Villa ${id} сонгогдсон</h3>
      <button class="btn btn-ghost" style="color:var(--red);" onclick="deleteVilla('${id}')">Вилла устгах</button>
    </div>
    <div class="room-tabs">
  `;
  ROOM_TYPES.forEach(r => {
    const active = state.activeRoom === r ? 'active' : '';
    html += `<div class="room-tab ${active}" onclick="setActiveRoom('${r}')">${r}</div>`;
  });
  html += `</div>`;

  const items = v.rooms[state.activeRoom] || [];
  html += `<div class="card room-panel"><table><thead><tr>
    <th class="col-num">№</th><th>Тавилга</th><th class="col-count">Тоо</th><th class="col-status">Төлөв</th><th class="col-del"></th>
  </tr></thead><tbody>`;

  items.forEach((item, idx) => {
    html += `
      <tr>
        <td class="col-num">${idx+1}</td>
        <td><input class="item-input" type="text" value="${item.name||''}" placeholder="Тавилгын нэр" onchange="updateItem('${id}','${state.activeRoom}','${item.id}','name',this.value)"></td>
        <td class="col-count"><input class="item-input count-input" type="number" value="${item.count||1}" onchange="updateItem('${id}','${state.activeRoom}','${item.id}','count',this.value)"></td>
        <td class="col-status">
          <select class="status-select ${statusClass(item.status)}" onchange="updateItem('${id}','${state.activeRoom}','${item.id}','status',this.value)">
            ${["Гэмтэлгүй байгаа", "Бага зэрэг гэмтэлтэй", "Эвдэрсэн", "Гэмтэлтэй", "Дутуу"].map(s => `<option value="${s}" ${item.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </td>
        <td class="col-del"><button class="btn-danger" onclick="deleteItem('${id}','${state.activeRoom}','${item.id}')">&times;</button></td>
      </tr>
    `;
  });
  html += `</tbody></table>`;
  html += `<button class="btn btn-ghost" style="margin-top:12px;" onclick="addItem('${id}','${state.activeRoom}')">+ Тавилга нэмэх</button></div>`;

  return html;
}

function renderReport(){
  let html = `<div class="card"><h2>Гэмтэлтэй тавилгын нэгтгэл</h2></div><div class="card"><table><thead><tr><th>Villa</th><th>Өрөө</th><th>Тавилга</th><th>Тоо</th><th>Төлөв</th></tr></thead><tbody>`;
  let hasIssues = false;
  state.villas.forEach(id => {
    const v = state.data[id];
    if(!v) return;
    ROOM_TYPES.forEach(r => {
      (v.rooms[r]||[]).forEach(item => {
        if(item.status && item.status !== "Гэмтэлгүй байгаа"){
          hasIssues = true;
          html += `<tr><td><b>${id}</b></td><td>${r}</td><td>${item.name}</td><td>${item.count}</td><td><span class="status-chip ${statusClass(item.status)}">${item.status}</span></td></tr>`;
        }
      });
    });
  });
  if(!hasIssues){
    html += `<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--ink-soft);">Одоогоор гэмтэлтэй тавилга бүртгэгдээгүй байна.</td></tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

function statusClass(status){
  if(status === "Гэмтэлгүй байгаа") return "status-good-bg";
  if(status === "Бага зэрэг гэмтэлтэй") return "status-warn-bg";
  return "status-bad-bg";
}

function addItem(id, room){
  ensureVilla(id);
  state.data[id].rooms[room].push({id: uid(), name:"", count:1, status:"Гэмтэлгүй байгаа"});
  saveData();
  render();
}

function updateItem(id, room, itemId, field, value){
  const item = state.data[id].rooms[room].find(i => i.id === itemId);
  if(!item) return;
  item[field] = value;
  saveData();
}

function deleteItem(id, room, itemId){
  state.data[id].rooms[room] = state.data[id].rooms[room].filter(i => i.id !== itemId);
  saveData();
  render();
}
</script>
</body>
</html>
