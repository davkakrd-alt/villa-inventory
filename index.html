<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Villa Тооллого & Засвар & Түлхүүр</title>
<style>
  :root{
    --ink:#1E2420;
    --ink-soft:#4B564E;
    --base:#F5F4EF;
    --base-raised:#FFFFFF;
    --border:#DBD6C8;
    --teal:#2B6E5E;
    --teal-deep:#1E4F43;
    --amber:#B5702C;
    --amber-bg:#FBEEDF;
    --red:#A63F2B;
    --red-bg:#F8E7E1;
    --gray-bg:#EAE7DD;
    --green-bg:#E8F5E9;
    --green:#2E7D32;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--base);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
    line-height:1.4;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:16px 12px 60px;}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif; margin:0;}

  /* Login Screen Style */
  .login-overlay {
    position: fixed; inset: 0; background: var(--base);
    display: flex; align-items: center; justify-content: center; z-index: 2000;
  }
  .login-box {
    background: var(--base-raised); border: 1px solid var(--border);
    padding: 30px; border-radius: 12px; text-align: center; max-width: 360px; width: 90%;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .login-box h2 { font-size: 1.5rem; margin-bottom: 6px; }
  .login-box input {
    width: 100%; padding: 12px; margin: 12px 0; text-align: center;
    font-size: 1.2rem; border: 1px solid var(--border); border-radius: 8px;
    background: #fff;
  }
  .login-box input:focus { outline: none; border-color: var(--teal); }

  header{margin-bottom:20px;}
  .header-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  h1{font-size:1.6rem; font-weight:600;}
  .totalcount{font-family:'Courier New',monospace; font-size:0.85rem; color:var(--ink-soft);}

  .tilegrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  .tile{
    aspect-ratio:1/1;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:1.5px solid var(--border);
    background:var(--base-raised);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    position:relative;
    user-select:none;
  }
  .tile:active{transform:scale(0.96);}
  .tile.selected{border-color:var(--teal); box-shadow:0 0 0 2px var(--teal);}
  .tile .num{font-family:'Courier New',monospace; font-weight:700; font-size:0.95rem;}
  .tile .badge{font-family:'Courier New',monospace; font-size:0.65rem; color:var(--red); font-weight:700; margin-top:2px;}
  .tile .dot{width:7px;height:7px;border-radius:50%;position:absolute;top:6px;right:6px;}

  .add-villa-tile {
    border: 1.5px dashed var(--teal);
    color: var(--teal);
    font-weight: bold;
    font-size: 1.4rem;
    background: transparent;
  }

  .card{background:var(--base-raised); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;}
  .card.empty{text-align:center; color:var(--ink-soft); padding:36px 16px;}

  .status-good-bg{background:#E7F0EC; color:var(--teal-deep); border:1px solid #BFDACE;}
  .status-warn-bg{background:var(--amber-bg); color:var(--amber); border:1px solid #E4C49B;}
  .status-bad-bg{background:var(--red-bg); color:var(--red); border:1px solid #E3B7AB;}
  .status-done-bg{background:var(--green-bg); color:var(--green); border:1px solid #C8E6C9;}

  .room-tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); padding:0 2px; flex-wrap:wrap;}
  .room-tab{padding:10px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-weight:600; font-size:0.85rem; color:var(--ink-soft); border:1px solid transparent;}
  .room-tab.active{background:var(--base-raised); border:1px solid var(--border); border-bottom:1px solid var(--base-raised); color:var(--ink); margin-bottom:-1px;}
  .room-tab.repair-tab{color:var(--amber);}
  .room-tab.key-tab{color:var(--teal);}

  .room-panel{border-radius:0 0 12px 12px; margin-top:0; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:0.88rem; min-width:580px;}
  thead th{text-align:left; color:var(--ink-soft); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; padding-bottom:8px;}
  tbody tr{border-top:1px solid var(--border);}
  tbody td{padding:8px 2px;}
  tbody tr.is-done { opacity: 0.6; text-decoration: line-through; }
  .col-num{width:28px; font-family:'Courier New',monospace; color:var(--ink-soft);}
  .col-photo{width:50px; text-align:center;}
  .col-count{width:65px;}
  .col-status{width:150px;}
  .col-del{width:32px; text-align:right;}

  input.item-input{background:transparent; border:1px solid transparent; border-radius:6px; padding:6px 8px; width:100%; font-size:0.88rem; font-family:inherit;}
  input.item-input:hover, input.item-input:focus{border-color:var(--teal); background:#fff; outline:none;}
  input.count-input{font-family:'Courier New',monospace;}

  select.status-select{font-size:0.78rem; border-radius:999px; padding:6px 8px; border:1px solid transparent; font-weight:600; cursor:pointer; width:100%;}

  .photo-thumb{
    width:38px; height:38px; border-radius:6px; object-fit:cover; cursor:pointer;
    border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center;
    background:var(--gray-bg); color:var(--ink-soft); font-size:0.9rem;
  }
  .photo-thumb:hover{ border-color:var(--teal); }

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:3000; padding:16px;}
  .modal-box{background:var(--base-raised); border-radius:12px; padding:20px; max-width:500px; width:90vw; max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; gap:12px;}
  .modal-img{max-width:80vw; max-height:70vh; border-radius:8px; object-fit:contain; align-self:center;}

  .btn{padding:8px 14px; border-radius:8px; font-weight:600; font-size:0.82rem; cursor:pointer; border:none; transition:opacity .12s; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; gap:4px;}
  .btn-primary{background:var(--teal); color:white;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:var(--red); border:none; font-size:1.2rem; cursor:pointer; padding:4px 8px;}
  .status-chip{padding:3px 8px; border-radius:999px; font-size:0.72rem; font-weight:600;}

  @media print {
    body { background: white; color: black; }
    .no-print, header button, .login-overlay, .tilegrid, .room-tabs { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    .card { border: none; padding: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 6px; }
  }
</style>

<!-- Login Screen -->
<div id="login-screen" class="login-overlay">
  <div class="login-box">
    <h2>Villa Тооллого & Засвар</h2>
    <p style="font-size: 0.85rem; color: var(--ink-soft); margin-top:4px;">ПИН кодоо оруулж нэвтэрнэ үү</p>
    <input type="password" id="pin-input" placeholder="****" maxlength="8" onkeyup="if(event.key==='Enter') checkPin()">

</div>

<!-- Image Modal -->
<div id="photo-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="align-items:center;">
    <img id="modal-img-element" class="modal-img" src="" alt="Зураг">

<!-- Change PIN Modal -->

    <div>

      <table style="min-width:100%;">

<input type="file" id="global-file-input" accept="image/*" style="display:none;" onchange="handleFileSelected(this)">

<script>
let ROOM_TYPES = ["Унтлагын", "Зочны", "Гадна", "Угаалгын", "Гал тогоо"];
const REPAIR_TAB = "🛠️ Засвар";
const KEY_TAB = "🔑 Түлхүүр";

const DATA_KEY = "villa-inventory-data-v2";
const VILLA_LIST_KEY = "villa-list-v2";
const USERS_KEY = "villa-users-list-v1";

// Анхны хэрэглэгч
const DEFAULT_USERS = [
  { id: "usr_admin", name: "Админ", pin: "1234", role: "admin" },
  { id: "usr_staff", name: "Ажилтан", pin: "0000", role: "staff" }
];

let state = {
  villas: Array.from({length: 31}, (_, i) => String(i + 1)),
  users: DEFAULT_USERS,
  currentUser: null,
  selectedVilla: null,
  activeRoom: ROOM_TYPES[0],
  data: {},
  loaded: false,
  saveStatus: 'saved',
  lastErrorMsg: '',
  view: 'main',
  uploadTarget: null
};

function checkPin() {
  const pin = document.getElementById('pin-input').value.trim();
  const foundUser = state.users.find(u => u.pin === pin);
  
  if(foundUser) {
    state.currentUser = foundUser;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('pin-input').value = "";
    loadData();
  } else {
    alert("Нэвтрэх ПИН код буруу байна!");
  }
}

function verifyAdminPermission(actionName, callback) {
  if (state.currentUser && state.currentUser.role === 'admin') {
    callback();
    return;
  }
  const inputPin = prompt(`"${actionName}" үйлдэл хийхэд АДМИН ПИН код шаардлагатай:`);
  const adminUser = state.users.find(u => u.pin === inputPin && u.role === 'admin');
  if(adminUser) {
    callback();
  } else if(inputPin !== null) {
    alert("Эрх хүрэлцэхгүй байна эсвэл ПИН код буруу байна! Зөвхөн админ хийх боломжтой.");
  }
}

function emptyVilla(){
  const rooms = {};
  ROOM_TYPES.forEach(r => { rooms[r] = []; });
  rooms[REPAIR_TAB] = [];
  rooms[KEY_TAB] = [];
  return { rooms };
}

function ensureVilla(id){
  if(!state.data[id]) state.data[id] = emptyVilla();
  ROOM_TYPES.forEach(r => {
    if(!state.data[id].rooms[r]) state.data[id].rooms[r] = [];
  });
  if(!state.data[id].rooms[REPAIR_TAB]) state.data[id].rooms[REPAIR_TAB] = [];
  if(!state.data[id].rooms[KEY_TAB]) state.data[id].rooms[KEY_TAB] = [];
  return state.data[id];
}

function uid(){ return Math.random().toString(36).slice(2,9); }

async function loadData(){
  const localVillas = localStorage.getItem(VILLA_LIST_KEY);
  const localData = localStorage.getItem(DATA_KEY);
  const localUsers = localStorage.getItem(USERS_KEY);

  if(localVillas) state.villas = JSON.parse(localVillas);
  if(localData) state.data = JSON.parse(localData);
  if(localUsers) state.users = JSON.parse(localUsers);

  if(dbClient){
    try{
      const { data: vList } = await dbClient.from('villa_store').select('value').eq('key', VILLA_LIST_KEY).maybeSingle();
      if(vList && vList.value) {
        state.villas = vList.value;
        localStorage.setItem(VILLA_LIST_KEY, JSON.stringify(vList.value));
      }

      const { data } = await dbClient.from('villa_store').select('value').eq('key', DATA_KEY).maybeSingle();
      if(data && data.value) {
        state.data = data.value;
        localStorage.setItem(DATA_KEY, JSON.stringify(data.value));
      }

      const { data: uList } = await dbClient.from('villa_store').select('value').eq('key', USERS_KEY).maybeSingle();
      if(uList && uList.value) {
        state.users = uList.value;
        localStorage.setItem(USERS_KEY, JSON.stringify(uList.value));
      }

      dbClient.channel('public:villa_store')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'villa_store' }, payload => {
          if(payload.new && payload.new.key === DATA_KEY){ state.data = payload.new.value; render(); }
          if(payload.new && payload.new.key === VILLA_LIST_KEY){ state.villas = payload.new.value; render(); }
          if(payload.new && payload.new.key === USERS_KEY){ state.users = payload.new.value; render(); }
        }).subscribe();
    }catch(e){ console.error("Cloud load error:", e); }
  }
  state.loaded = true;
  render();
}

async function saveData(){
  localStorage.setItem(VILLA_LIST_KEY, JSON.stringify(state.villas));
  localStorage.setItem(DATA_KEY, JSON.stringify(state.data));
  localStorage.setItem(USERS_KEY, JSON.stringify(state.users));

  if(!dbClient) return;
  state.saveStatus = 'saving';
  renderSaveStatus();

  try{
    const { error: err1 } = await dbClient.from('villa_store').upsert({ key: DATA_KEY, value: state.data }, { onConflict: 'key' });
    const { error: err2 } = await dbClient.from('villa_store').upsert({ key: VILLA_LIST_KEY, value: state.villas }, { onConflict: 'key' });
    const { error: err3 } = await dbClient.from('villa_store').upsert({ key: USERS_KEY, value: state.users }, { onConflict: 'key' });
    
    if(err1 || err2 || err3) {
      console.error("Save error:", err1, err2, err3);
      state.saveStatus = 'error';
      state.lastErrorMsg = ((err1?err1.message:'') + ' ' + (err2?err2.message:'') + ' ' + (err3?err3.message:'')).trim();
    } else {
      state.saveStatus = 'saved';
      state.lastErrorMsg = '';
    }
  }catch(e){ 
    console.error(e);
    state.saveStatus = 'error'; 
    state.lastErrorMsg = e.message || 'Сүлжээний эвдрэл';
  }
  renderSaveStatus();
}

function renderSaveStatus(){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(state.saveStatus === 'saving') {
    el.textContent = '☁️ Хадгалж байна...';
    el.style.color = '#B5702C';
  } else if(state.saveStatus === 'saved') {
    el.textContent = '✓ Хадгалагдсан (Cloud)';
    el.style.color = '#2E7D32';
  } else {
    el.textContent = '⚠️ Серверт хадгалагдсангүй (Локал санах ойд хадгалагдсан)';
    el.style.color = '#A63F2B';
    el.style.cursor = 'pointer';
    el.title = "Дэлгэрэнгүй харах бол дарна уу";
    el.onclick = () => alert("Алдааны мэдээлэл: " + state.lastErrorMsg);
  }
}

function triggerPhotoUpload(id, room, itemId){
  state.uploadTarget = { id, room, itemId };
  document.getElementById('global-file-input').click();
}

function handleFileSelected(input){
  if(!input.files || !input.files[0] || !state.uploadTarget) return;
  const file = input.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();
    img.src = e.target.result;
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxDim = 400; 
      let w = img.width;
      let h = img.height;

      if (w > h && w > maxDim) {
        h *= maxDim / w;
        w = maxDim;
      } else if (h > maxDim) {
        w *= maxDim / h;
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const compressedUrl = canvas.toDataURL('image/jpeg', 0.4);

      const { id, room, itemId } = state.uploadTarget;
      const item = state.data[id].rooms[room].find(i => i.id === itemId);
      if(item){
        item.photo = compressedUrl;
        saveData();
        render();
      }
      input.value = "";
    };
  };
  reader.readAsDataURL(file);
}

function viewPhoto(url){
  document.getElementById('modal-img-element').src = url;
  document.getElementById('photo-modal').style.display = 'flex';
}
function closePhotoModal(){ document.getElementById('photo-modal').style.display = 'none'; }

// PIN & User Management
function openPinModal() {
  document.getElementById('old-pin').value = '';
  document.getElementById('new-pin').value = '';
  document.getElementById('confirm-pin').value = '';
  document.getElementById('pin-modal').style.display = 'flex';
}
function closePinModal() { document.getElementById('pin-modal').style.display = 'none'; }

function saveNewPin() {
  const oldPin = document.getElementById('old-pin').value.trim();
  const newPin = document.getElementById('new-pin').value.trim();
  const confirmPin = document.getElementById('confirm-pin').value.trim();

  if (oldPin !== state.currentUser.pin) { alert("Одоогийн ПИН код буруу байна!"); return; }
  if (!newPin || newPin.length < 4) { alert("Шинэ ПИН код хамгийн багадаа 4 оронтой байна!"); return; }
  if (newPin !== confirmPin) { alert("Шинэ ПИН код хоорондоо тарахгүй байна!"); return; }

  state.currentUser.pin = newPin;
  saveData();
  closePinModal();
  alert("ПИН код амжилттай солигдлоо!");
}

function openUsersModal() {
  verifyAdminPermission("Хэрэглэгчид удирдах", () => {
    renderUsersList();
    document.getElementById('users-modal').style.display = 'flex';
  });
}
function closeUsersModal() { document.getElementById('users-modal').style.display = 'none'; }

function renderUsersList() {
  const tbody = document.getElementById('users-table-body');
  tbody.innerHTML = '';
  state.users.forEach(u => {
    tbody.innerHTML += `
      <tr>
        <td><b>${u.name}</b></td>
        <td><span class="status-chip ${u.role==='admin'?'status-good-bg':'status-warn-bg'}">${u.role}</span></td>
        <td><code>${u.pin}</code></td>
        <td>
          ${u.id !== state.currentUser.id ? `<button class="btn-danger" onclick="deleteUser('${u.id}')">&times;</button>` : ''}
        </td>
      </tr>
    `;
  });
}

function createNewUser() {
  const name = document.getElementById('new-user-name').value.trim();
  const pin = document.getElementById('new-user-pin').value.trim();
  const role = document.getElementById('new-user-role').value;

  if(!name || !pin) { alert("Нэр болон ПИН кодыг гүйцэд оруулна уу!"); return; }
  if(state.users.some(u => u.pin === pin)) { alert("Ийм ПИН кодтой хэрэглэгч байна! Өөр ПИН сонгоно уу."); return; }

  state.users.push({ id: uid(), name, pin, role });
  saveData();
  renderUsersList();
  document.getElementById('new-user-name').value = '';
  document.getElementById('new-user-pin').value = '';
}

function deleteUser(userId) {
  if(confirm("Энэ хэрэглэгчийг устгах уу?")) {
    state.users = state.users.filter(u => u.id !== userId);
    saveData();
    renderUsersList();
  }
}

function addVillaPrompt(){
  verifyAdminPermission("Шинэ Вилла нэмэх", () => {
    const name = prompt("Шинэ Вилла дугаарыг оруулна уу:");
    if(name && name.trim()){
      const trimmed = name.trim();
      if(state.villas.includes(trimmed)){ alert("Ийм вилла байна!"); return; }
      state.villas.push(trimmed);
      ensureVilla(trimmed);
      saveData(); render();
    }
  });
}

function deleteVilla(id){
  verifyAdminPermission(`Villa ${id}-г устгах`, () => {
    if(confirm(`Та Villa ${id}-г устгахдаа итгэлтэй байна уу?`)){
      state.villas = state.villas.filter(v => v !== id);
      delete state.data[id];
      if(state.selectedVilla === id) state.selectedVilla = null;
      saveData(); render();
    }
  });
}

function villaIssueCount(id){
  const v = state.data[id];
  if(!v) return 0;
  let count = 0;
  ROOM_TYPES.forEach(r => {
    (v.rooms[r]||[]).forEach(item => {
      if(item.status && item.status !== "Гэмтэлгүй байгаа") count++;
    });
  });
  (v.rooms[REPAIR_TAB]||[]).forEach(item => {
    if(!item.isDone) count++;
  });
  (v.rooms[KEY_TAB]||[]).forEach(item => {
    if(item.status && item.status === "Алга болсон / Дутуу") count++;
  });
  return count;
}

function totalIssuesAll(){
  let t = 0;
  state.villas.forEach(id => { t += villaIssueCount(id); });
  return t;
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded) return;

  let html = `
    <header class="no-print">
      <div class="header-row">
        <div>
          <h1>Villa Тооллого & Засвар</h1>
          <div class="totalcount">${state.villas.length} байшин &middot; ${totalIssuesAll()} нээлттэй засвар / гэмтэл / түлхүүр</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:0.85rem; font-weight:bold;">👤 ${state.currentUser?state.currentUser.name:''} (${state.currentUser?state.currentUser.role:''})</span>
          <button class="btn btn-ghost" onclick="openPinModal()">🔑 ПИН солих</button>
          ${state.currentUser && state.currentUser.role === 'admin' ? `<button class="btn btn-ghost" onclick="openUsersModal()">👥 Хэрэглэгчид</button>` : ''}
          <button class="btn btn-ghost" onclick="location.reload()">Гарах</button>
        </div>
      </div>
      <div style="margin-top:12px; display:flex; align-items:center; justify-content:space-between;">
        <button class="btn btn-primary" onclick="toggleReport()">${state.view==='report' ? '← Буцах' : '📋 Нэгтгэлийн тайлан харах'}</button>
        <span id="save-status" style="font-size:0.8rem; font-weight:bold; color:#2E7D32;">✓ Хадгалагдсан (Cloud)</span>
      </div>
    </header>
  `;

  if(state.view === 'report'){
    html += renderReport();
    app.innerHTML = html;
    return;
  }

  html += `<div class="tilegrid no-print">`;
  state.villas.forEach(id => {
    const issues = villaIssueCount(id);
    const sel = state.selectedVilla === id ? 'selected' : '';
    html += `
      <div class="tile ${sel}" onclick="selectVilla('${id}')">
        ${issues > 0 ? `<div class="dot" style="background:var(--red)"></div>` : ''}
        <span class="num">${id}</span>
        ${issues > 0 ? `<span class="badge">${issues}</span>` : ''}
      </div>
    `;
  });
  html += `<div class="tile add-villa-tile" onclick="addVillaPrompt()" title="Шинэ вилла нэмэх">+</div></div>`;

  if(state.selectedVilla){
    html += renderVillaDetail(state.selectedVilla);
  } else {
    html += `<div class="card empty">Дээрээс засах Villa дугаараа сонгоно уу.</div>`;
  }

  app.innerHTML = html;
  renderSaveStatus();
}

function selectVilla(id){ state.selectedVilla = id; state.activeRoom = ROOM_TYPES[0]; ensureVilla(id); render(); }
function setActiveRoom(r){ state.activeRoom = r; render(); }
function toggleReport(){ state.view = state.view === 'report' ? 'main' : 'report'; render(); }

function renderVillaDetail(id){
  ensureVilla(id);
  const v = state.data[id];

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3>Villa ${id} сонгогдсон</h3>
      <button class="btn btn-ghost" style="color:var(--red);" onclick="deleteVilla('${id}')">Вилла устгах</button>
    </div>
    <div class="room-tabs">
  `;
  
  ROOM_TYPES.forEach(r => {
    const active = state.activeRoom === r ? 'active' : '';
    html += `<div class="room-tab ${active}" onclick="setActiveRoom('${r}')">${r}</div>`;
  });
  
  const keyActive = state.activeRoom === KEY_TAB ? 'active' : '';
  const keyCount = (v.rooms[KEY_TAB]||[]).filter(i => i.status === "Алга болсон / Дутуу").length;
  html += `<div class="room-tab key-tab ${keyActive}" onclick="setActiveRoom('${KEY_TAB}')">🔑 Түлхүүр ${keyCount>0 ? `(${keyCount})`:''}</div>`;

  const repairActive = state.activeRoom === REPAIR_TAB ? 'active' : '';
  const repairCount = (v.rooms[REPAIR_TAB]||[]).filter(i => !i.isDone).length;
  html += `<div class="room-tab repair-tab ${repairActive}" onclick="setActiveRoom('${REPAIR_TAB}')">🛠️ Засвар ${repairCount>0 ? `(${repairCount})`:''}</div></div>`;

  const items = v.rooms[state.activeRoom] || [];

  if(state.activeRoom === REPAIR_TAB){
    html += `<div class="card room-panel" style="padding:16px;">
      <p style="font-size:0.85rem; color:var(--ink-soft); margin-bottom:12px;">🔒 Засвар дууссан ("Засагдсан") гэж тэмдэглэх болон ажлыг устгахад Админ ПИН шаардлагатай.</p>
      <table><thead><tr>
        <th class="col-num">№</th>
        <th class="col-photo">Зураг</th>
        <th>Хийгдэх засварын ажил</th>
        <th class="col-status">Төлөв</th>
        <th class="col-del"></th>
      </tr></thead><tbody>`;
      
    items.forEach((item, idx) => {
      const photoHtml = item.photo 
        ? `<img src="${item.photo}" class="photo-thumb" onclick="viewPhoto('${item.photo}')">` 
        : `<button class="photo-thumb" onclick="triggerPhotoUpload('${id}','${REPAIR_TAB}','${item.id}')">📷</button>`;

      const isDoneClass = item.isDone ? 'is-done' : '';

      html += `<tr class="${isDoneClass}">
        <td class="col-num">${idx+1}</td>
        <td class="col-photo">${photoHtml}</td>
        <td><input class="item-input" type="text" value="${item.name||''}" placeholder="Жишээ нь: Шүршүүрийн хоолой засах" onchange="updateItem('${id}','${REPAIR_TAB}','${item.id}','name',this.value)"></td>
        <td class="col-status">
          <label style="cursor:pointer; display:inline-flex; align-items:center; gap:4px; font-weight:bold; font-size:0.8rem; color:${item.isDone ? 'var(--green)' : 'var(--red)'};">
            <input type="checkbox" ${item.isDone ? 'checked' : ''} onchange="toggleDoneProtected('${id}','${REPAIR_TAB}','${item.id}', this)">
            ${item.isDone ? '✅ Засагдсан' : '⏳ Хүлээгдэж буй'}
          </label>
        </td>
        <td class="col-del"><button class="btn-danger" onclick="deleteItemProtected('${id}','${REPAIR_TAB}','${item.id}')">&times;</button></td>
      </tr>`;
    });
    html += `</tbody></table>
      <button class="btn btn-ghost" style="margin-top:12px;" onclick="addItem('${id}','${REPAIR_TAB}')">+ Засварын ажил нэмэх</button>
    </div>`;

  } else if(state.activeRoom === KEY_TAB) {
    html += `<div class="card room-panel"><table><thead><tr>
      <th class="col-num">№</th>
      <th class="col-photo">Зураг</th>
      <th>Түлхүүрийн нэр / Дугаар</th>
      <th class="col-count">Тоо</th>
      <th class="col-status">Төлөв / Байршил</th>
      <th class="col-del"></th>
    </tr></thead><tbody>`;

    items.forEach((item, idx) => {
      const photoHtml = item.photo 
        ? `<img src="${item.photo}" class="photo-thumb" onclick="viewPhoto('${item.photo}')">` 
        : `<button class="photo-thumb" onclick="triggerPhotoUpload('${id}','${KEY_TAB}','${item.id}')">📷</button>`;

      html += `
        <tr>
          <td class="col-num">${idx+1}</td>
          <td class="col-photo">${photoHtml}</td>
          <td><input class="item-input" type="text" value="${item.name||''}" placeholder="Үндсэн түлхүүр, Мастер гэх мэт" onchange="updateItem('${id}','${KEY_TAB}','${item.id}','name',this.value)"></td>
          <td class="col-count"><input class="item-input count-input" type="number" value="${item.count||1}" onchange="updateItem('${id}','${KEY_TAB}','${item.id}','count',this.value)"></td>
          <td class="col-status">
            <select class="status-select ${keyStatusClass(item.status)}" onchange="updateItem('${id}','${KEY_TAB}','${item.id}','status',this.value)">
              ${["Бүрэн (Байрандаа)", "Ажилчдад байгаа", "Захиалагчид байгаа", "Алга болсон / Дутуу"].map(s => `<option value="${s}" ${item.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="col-del"><button class="btn-danger" onclick="deleteItemProtected('${id}','${KEY_TAB}','${item.id}')">&times;</button></td>
        </tr>
      `;
    });
    html += `</tbody></table>
    <button class="btn btn-ghost" style="margin-top:12px;" onclick="addItem('${id}','${KEY_TAB}')">+ Түлхүүр нэмэх</button></div>`;

  } else {
    html += `<div class="card room-panel"><table><thead><tr>
      <th class="col-num">№</th>
      <th class="col-photo">Зураг</th>
      <th>Тавилга</th>
      <th class="col-count">Тоо</th>
      <th class="col-status">Төлөв</th>
      <th class="col-del"></th>
    </tr></thead><tbody>`;

    items.forEach((item, idx) => {
      const photoHtml = item.photo 
        ? `<img src="${item.photo}" class="photo-thumb" onclick="viewPhoto('${item.photo}')">` 
        : `<button class="photo-thumb" onclick="triggerPhotoUpload('${id}','${state.activeRoom}','${item.id}')">📷</button>`;

      html += `
        <tr>
          <td class="col-num">${idx+1}</td>
          <td class="col-photo">${photoHtml}</td>
          <td><input class="item-input" type="text" value="${item.name||''}" placeholder="Тавилгын нэр" onchange="updateItem('${id}','${state.activeRoom}','${item.id}','name',this.value)"></td>
          <td class="col-count"><input class="item-input count-input" type="number" value="${item.count||1}" onchange="updateItem('${id}','${state.activeRoom}','${item.id}','count',this.value)"></td>
          <td class="col-status">
            <select class="status-select ${statusClass(item.status)}" onchange="updateItem('${id}','${state.activeRoom}','${item.id}','status',this.value)">
              ${["Гэмтэлгүй байгаа", "Бага зэрэг гэмтэлтэй", "Эвдэрсэн", "Гэмтэлтэй", "Дутуу"].map(s => `<option value="${s}" ${item.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="col-del"><button class="btn-danger" onclick="deleteItemProtected('${id}','${state.activeRoom}','${item.id}')">&times;</button></td>
        </tr>
      `;
    });
    html += `</tbody></table>
    <button class="btn btn-ghost" style="margin-top:12px;" onclick="addItem('${id}','${state.activeRoom}')">+ Тавилга нэмэх</button></div>`;
  }

  return html;
}

function renderReport(){
  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2>📋 Нийт Засвар, Түлхүүр болон Гэмтэлтэй Тавилгын Нэгтгэл</h2>
      <button class="btn btn-primary no-print" onclick="window.print()">🖨️ Тайлан хэвлэх (Print/PDF)</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px;">1. Гэмтэлтэй тавилга / Эд зүйлс</h3>
      <table><thead><tr><th>Villa</th><th>Өрөө</th><th>Зураг</th><th>Тавилга</th><th>Тоо</th><th>Төлөв</th></tr></thead><tbody>`;
  
  let hasFurnitureIssues = false;
  state.villas.forEach(id => {
    const v = state.data[id];
    if(!v) return;
    ROOM_TYPES.forEach(r => {
      (v.rooms[r]||[]).forEach(item => {
        if(item.status && item.status !== "Гэмтэлгүй байгаа"){
          hasFurnitureIssues = true;
          const photoThumb = item.photo ? `<img src="${item.photo}" class="photo-thumb" onclick="viewPhoto('${item.photo}')">` : '-';
          html += `<tr><td><b>Villa ${id}</b></td><td>${r}</td><td>${photoThumb}</td><td>${item.name||'-'}</td><td>${item.count||1}</td><td><span class="status-chip ${statusClass(item.status)}">${item.status}</span></td></tr>`;
        }
      });
    });
  });
  if(!hasFurnitureIssues) html += `<tr><td colspan="6" style="text-align:center; color:var(--ink-soft); padding:12px;">Гэмтэлтэй тавилга одоогоор бүртгэгдээгүй байна.</td></tr>`;
  html += `</tbody></table></div>`;

  html += `<div class="card">
    <h3 style="margin-bottom:10px;">2. Түлхүүрийн Тайлан (Алга болсон / Анхаарах)</h3>
    <table><thead><tr><th>Villa</th><th>Зураг</th><th>Түлхүүр</th><th>Тоо</th><th>Төлөв / Байршил</th></tr></thead><tbody>`;

  let hasKeyIssues = false;
  state.villas.forEach(id => {
    const v = state.data[id];
    if(!v) return;
    (v.rooms[KEY_TAB]||[]).forEach(item => {
      if(item.status && item.status === "Алга болсон / Дутуу"){
        hasKeyIssues = true;
        const photoThumb = item.photo ? `<img src="${item.photo}" class="photo-thumb" onclick="viewPhoto('${item.photo}')">` : '-';
        html += `<tr><td><b>Villa ${id}</b></td><td>${photoThumb}</td><td>${item.name||'-'}</td><td>${item.count||1}</td><td><span class="status-chip ${keyStatusClass(item.status)}">${item.status}</span></td></tr>`;
      }
    });
  });
  if(!hasKeyIssues) html += `<tr><td colspan="5" style="text-align:center; color:var(--ink-soft); padding:12px;">Алга болсон/дутуу түлхүүр одоогоор байхгүй байна.</td></tr>`;
  html += `</tbody></table></div>`;

  html += `<div class="card">
    <h3 style="margin-bottom:10px;">3. Хийгдэх тусгай засварын ажлууд</h3>
    <table><thead><tr><th>Villa</th><th>Зураг</th><th>Засварын ажил / Тэмдэглэл</th><th>Төлөв</th></tr></thead><tbody>`;

  let hasRepairs = false;
  state.villas.forEach(id => {
    const v = state.data[id];
    if(!v) return;
    (v.rooms[REPAIR_TAB]||[]).forEach(item => {
      if(item.name && item.name.trim() !== ""){
        hasRepairs = true;
        const photoThumb = item.photo ? `<img src="${item.photo}" class="photo-thumb" onclick="viewPhoto('${item.photo}')">` : '-';
        const doneBadge = item.isDone ? `<span class="status-chip status-done-bg">✅ Засагдсан</span>` : `<span class="status-chip status-bad-bg">⏳ Хүлээгдэж буй</span>`;
        html += `<tr class="${item.isDone ? 'is-done' : ''}"><td><b>Villa ${id}</b></td><td>${photoThumb}</td><td>${item.name}</td><td>${doneBadge}</td></tr>`;
      }
    });
  });
  if(!hasRepairs) html += `<tr><td colspan="4" style="text-align:center; color:var(--ink-soft); padding:12px;">Засварын ажил бүртгэгдээгүй байна.</td></tr>`;
  html += `</tbody></table></div>`;

  return html;
}

function statusClass(status){
  if(status === "Гэмтэлгүй байгаа") return "status-good-bg";
  if(status === "Бага зэрэг гэмтэлтэй") return "status-warn-bg";
  return "status-bad-bg";
}

function keyStatusClass(status){
  if(status === "Бүрэн (Байрандаа)") return "status-good-bg";
  if(status === "Алга болсон / Дутуу") return "status-bad-bg";
  return "status-warn-bg";
}

function addItem(id, room){
  ensureVilla(id);
  const defaultStatus = room === KEY_TAB ? "Бүрэн (Байрандаа)" : "Гэмтэлгүй байгаа";
  state.data[id].rooms[room].push({id: uid(), name:"", count:1, status: defaultStatus, photo:null, isDone: false});
  saveData(); render();
}

function updateItem(id, room, itemId, field, value){
  const item = state.data[id].rooms[room].find(i => i.id === itemId);
  if(!item) return;
  item[field] = value;
  saveData();
}

function toggleDoneProtected(id, room, itemId, checkbox) {
  const isChecking = checkbox.checked;
  verifyAdminPermission(isChecking ? "Засагдсан гэж тэмдэглэх" : "Төлөв өөрчлөх", () => {
    const item = state.data[id].rooms[room].find(i => i.id === itemId);
    if(item) {
      item.isDone = isChecking;
      saveData();
      render();
    }
  });
  checkbox.checked = !isChecking; 
}

function deleteItemProtected(id, room, itemId){
  verifyAdminPermission("Ажил/Тавилга/Түлхүүр устгах", () => {
    state.data[id].rooms[room] = state.data[id].rooms[room].filter(i => i.id !== itemId);
    saveData(); render();
  });
}
</script>
</body>
</html>
